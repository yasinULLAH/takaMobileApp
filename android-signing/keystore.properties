# Signing key used by GitHub Actions to build a release APK.
#
# IMPORTANT: keep this key (and its passwords) forever. Android only installs an
# update over an existing app when it is signed with the *same* key. If this file
# is lost or replaced, every phone has to uninstall the old app first, which also
# deletes the app's local database.
#
# This file is committed on purpose so that the workflow works with no extra setup.
# To use your own private key instead, delete the keystore below and add the GitHub
# secrets described in ANDROID-APK.md (the workflow prefers those secrets).
storeFile=taka-release.jks
storeType=PKCS12
storePassword=KPKTekedarRelease2026
keyAlias=kpktekeder
