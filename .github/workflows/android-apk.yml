name: Build Android APK

# Runs on every commit, so the APK download always matches the latest code.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build offline release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # needed for the commit-count version code
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists in the SDK repository
          # (the runner already has cmdline-tools), and installing it makes
          # setup-android fail before the build starts.
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install build dependencies
        run: npm ci

      - name: Build self-contained offline web bundle
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets into the app
        run: npx cap sync android

      - name: Apply native app configuration
        run: npm run configure:android

      - name: Generate launcher icon and splash screens
        run: |
          npm run build:icons
          npx capacitor-assets generate --android \
            --iconBackgroundColor "#0b1220" \
            --iconBackgroundColorDark "#0b1220" \
            --splashBackgroundColor "#f4f7fb" \
            --splashBackgroundColorDark "#0b1220" \
            --logoSplashScale 0.22

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the private keystore from repository secrets."
            mkdir -p android-signing
            echo "$KEYSTORE_BASE64" | base64 --decode > android-signing/taka-release.jks
            {
              echo "storeFile=taka-release.jks"
              echo "storeType=PKCS12"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android-signing/keystore.properties
          else
            echo "Using the committed release keystore (android-signing/taka-release.jks)."
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and collect APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 5
          mkdir -p dist
          cp "$APK" dist/KPK-Tekedar.apk
          echo "APK size: $(du -h dist/KPK-Tekedar.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPK-Tekedar-APK
          path: dist/KPK-Tekedar.apk
          if-no-files-found: error
          retention-days: 90

      # A release gives you a stable download link that works directly on the phone:
      # https://github.com/yasinULLAH/takaMobileApp/releases/download/apk-latest/KPK-Tekedar.apk
      - name: Publish latest APK to GitHub Releases
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Automated offline release build from commit ${GITHUB_SHA:0:7}."

          if gh release view apk-latest > /dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest \
              --title "KPK Tekedar — latest APK" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi

          gh release upload apk-latest dist/KPK-Tekedar.apk --clobber

      - name: Job summary
        run: |
          {
            echo "## KPK Tekedar APK built"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- APK: \`dist/KPK-Tekedar.apk\` (artifact **KPK-Tekedar-APK**)"
            echo "- Direct download (default branch builds): https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/KPK-Tekedar.apk"
            echo ""
            echo "The APK is fully self-contained: all CDN libraries and fonts are bundled inside it."
          } >> "$GITHUB_STEP_SUMMARY"

